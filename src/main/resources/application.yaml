server:
  port: 8080
  servlet:
    context-path: /bookstore

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/bookstore_mysql"
    username:
    password:

  data:
    mongodb:
      uri:
      auto-index-creation: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

jwt:
  signerKey:

cloudinary:
  cloud-name: dfinfmcan
  api-key:
  api-secret: t

stripe:
  apiKey:
openai:
  api:
    key: ${OPENAI_API_KEY}
